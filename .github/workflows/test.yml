name: "✔️ テスト"

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# 同じ PR に新しい push があれば、古い run をキャンセルする (main は、コミットごとの結果を残すためキャンセルしない)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: "helper の単体テスト"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Go を入れる"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: "書式"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w で直してください: $unformatted"
            exit 1
          fi

      - name: "go vet"
        run: go vet ./...

      - name: "go test"
        run: go test -race ./...

  publish:
    name: "イメージの publish の reusable workflow (ローカルの registry)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # publish.yml の step を抜き出し、ローカルの registry (registry:2) で、入力の検査・スキップ・ビルドと push・digest を確かめる。
      # WIF と本物の Artifact Registry への push は、ここでは確かめない
      - name: "tests/publish_test.sh"
        run: bash tests/publish_test.sh

  action:
    name: "TF_TOKEN なしで terraform get できる (${{ matrix.os }})"
    # fork からの PR では ID トークンを取得できないため動かさない
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # helper が取得する ID トークン
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup-terraform が書く ~/.terraformrc と、helper の CLI 設定がぶつからないことも確かめる
      - name: "Terraform を入れる"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      # self-repository の形 ($/) は、actionlint・ghalint がまだ読めないため、./ にする
      - name: "credentials helper を入れる"
        uses: ./

      # トークンそのものは出さず、audience と発行元だけを確かめる
      - name: "host を指定しないと、helper が registry.fastship.jp の ID トークンを返す"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            helper="$(cygpath -u "$APPDATA")/terraform.d/plugins/terraform-credentials-fastship.exe"
          else
            helper="$HOME/.terraform.d/plugins/terraform-credentials-fastship"
          fi
          token=$("$helper" get registry.fastship.jp | jq -r .token)
          payload=$(cut -d. -f2 <<< "$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims=$(base64 -d <<< "$payload")
          test "$(jq -r .aud <<< "$claims")" = "https://registry.fastship.jp/v2"
          test "$(jq -r .iss <<< "$claims")" = "https://token.actions.githubusercontent.com"
          echo "OK: aud と iss が正しい"
          grep -qxF 'credentials_helper "fastship" { args = ["--host=registry.fastship.jp"] }' "$(dirname "$(dirname "$helper")")/fastship.tfrc"
          echo "OK: host を指定しないと registry.fastship.jp になる"

          # ほかのホスト (provider を取る registry.terraform.io など) には渡さない
          test "$("$helper" get registry.terraform.io)" = "{}"
          echo "OK: ほかのホストには {} を返す"

      # registry.fastship.jp は、theindiehacker の組織のワークフローの ID トークンを受け付ける
      - name: "TF_TOKEN なしで、本物の registry から terraform get する"
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p e2e && cd e2e
          cat > main.tf <<'EOF'
          module "rdb" {
            source  = "registry.fastship.jp/modules/rdb/google"
            version = "1.0.0"
          }
          EOF
          terraform get -no-color
          test -d .terraform/modules/rdb
          echo "OK: モジュールを取得できた"

  cli-config-file:
    name: "TF_CLI_CONFIG_FILE があるときも terraform get できる"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # helper が取得する ID トークン
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Terraform を入れる"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      # Terraform は TF_CLI_CONFIG_FILE があると ~/.terraform.d/*.tfrc を読まないため、helper の設定はこのファイルに足される
      - name: "既にある CLI 設定"
        run: |
          config="$RUNNER_TEMP/terraformrc"
          printf 'plugin_cache_dir = "%s"\n' "$RUNNER_TEMP" > "$config"
          echo "TF_CLI_CONFIG_FILE=$config" >> "$GITHUB_ENV"

      - name: "credentials helper を入れる"
        uses: ./

      - name: "TF_TOKEN なしで、本物の registry から terraform get する"
        working-directory: ${{ runner.temp }}
        run: |
          grep -q 'plugin_cache_dir' "$TF_CLI_CONFIG_FILE"
          grep -q 'credentials_helper "fastship"' "$TF_CLI_CONFIG_FILE"
          mkdir -p e2e && cd e2e
          cat > main.tf <<'EOF'
          module "rdb" {
            source  = "registry.fastship.jp/modules/rdb/google"
            version = "1.0.0"
          }
          EOF
          terraform get -no-color
          test -d .terraform/modules/rdb
          echo "OK: モジュールを取得できた"

  host:
    name: "host を指定すると、そのホストにだけトークンを渡す"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # helper が取得する ID トークン
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "スキームを付けたホストは断る"
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          host: "https://registry.example.io"

      - name: "断ったことを確かめる"
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          test ! -e ~/.terraform.d/fastship.tfrc
          echo "OK: 断った"

      - name: "credentials helper を入れる"
        uses: ./
        with:
          host: "Registry.Example.IO"

      # トークンそのものは出さず、audience と発行元だけを確かめる
      - name: "helper が指定したホストの ID トークンだけを返す"
        run: |
          grep -qxF 'credentials_helper "fastship" { args = ["--host=registry.example.io"] }' ~/.terraform.d/fastship.tfrc
          helper="$HOME/.terraform.d/plugins/terraform-credentials-fastship"
          token=$("$helper" --host=registry.example.io get registry.example.io | jq -r .token)
          payload=$(cut -d. -f2 <<< "$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims=$(base64 -d <<< "$payload")
          test "$(jq -r .aud <<< "$claims")" = "https://registry.example.io/v2"
          test "$(jq -r .iss <<< "$claims")" = "https://token.actions.githubusercontent.com"
          echo "OK: aud と iss が正しい"

          # 既定のホスト (registry.fastship.jp) にも、ほかのホストにも渡さない
          test "$("$helper" --host=registry.example.io get registry.fastship.jp)" = "{}"
          test "$("$helper" --host=registry.example.io get registry.terraform.io)" = "{}"
          echo "OK: ほかのホストには {} を返す"
